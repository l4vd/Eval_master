[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-master"
version = "0.1.0"
description = "Central Hydra launcher that composes one shared model config and runs the four *-reproduce benchmarks (FaithEval, TruthfulQA, HaluEval, RAGTruth) as subprocesses in their own per-benchmark environments."
readme = "README-runner.md"
requires-python = ">=3.9"

# The launcher itself only needs Hydra; each benchmark brings its own stack in
# its own virtualenv (see setup_envs.sh / README-runner.md). numpy backs the
# read-only `analysis` aggregation package; scipy/matplotlib are lazy extras.
dependencies = [
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff"]
stats = ["scipy>=1.10"]        # Wilcoxon signed-rank in analysis.stats (lazy import)
plot = ["matplotlib>=3.7"]     # figures in analysis.plot (lazy import)

# run_benchmarks.py is a script run in place; the importable code is the additive
# read-only `analysis` package (aggregation / comparison / plotting over results).
[tool.setuptools.packages.find]
include = ["analysis*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["analysis/tests"]

# --- lint -----------------------------------------------------------------------
# Mirrors SP-DPO-Base/pyproject.toml so the two sides of the repo are held to one
# standard. Run it over the whole tree: `python -m ruff check .` (the excludes below
# are what keep that meaningful).
[tool.ruff]
line-length = 100
target-version = "py39"   # `requires-python` above; the benchmark venvs vary

# Only code this repo maintains is linted. Every path below is BYTE-IDENTICAL to the
# upstream benchmark it was forked from (verified with diff), and that identity is the
# point: modernising it would break comparability with the published numbers and make
# future upstream diffs unreadable. The forks' genuinely modified files —
# HaluEval-reproduce/evaluation/, TruthfulQA-reproduce/truthfulqa/{evaluate,metrics,
# models}.py, and every */src — are linted normally.
extend-exclude = [
    # Pristine upstream checkouts, kept for reference.
    "HaluEval",
    "TruthfulQA",
    "RAGTruth",
    # Unmodified upstream files living inside the forks.
    "HaluEval-reproduce/generation",
    "HaluEval-reproduce/analysis",
    "RAGTruth-reproduce/baseline",
    "TruthfulQA-reproduce/setup.py",
    "TruthfulQA-reproduce/truthfulqa/__init__.py",
    "TruthfulQA-reproduce/truthfulqa/configs.py",
    "TruthfulQA-reproduce/truthfulqa/presets.py",
    "TruthfulQA-reproduce/truthfulqa/utilities.py",
    # Run artifacts.
    "outputs",
]

[tool.ruff.lint]
# SP-DPO-Base's set minus "UP". These forks are upstream code in upstream's house style,
# where `.format()` is pervasive; auto-modernising ~180 call sites would be churn on
# exactly the files whose diff against upstream needs to stay readable.
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]  # line length handled by the formatter
