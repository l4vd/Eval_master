# Task config for FaithEval-unanswerable-v1.0.
# The context does not contain the answer to the question; a faithful model
# should refuse to answer rather than fabricate one.
dataset_name: Salesforce/FaithEval-unanswerable-v1.0
scoring: phrase_match

task_specific_prompt: >-
  If there is no information available from the context, the answer should be 'unknown'.

# NOTE: scoring is a SUBSTRING test (see metrics.phrase_match), not a word match, so
# "not" also matches inside "notable", "nothing", "cannot" and "another" — answers that
# never refused still count as correct. Kept because it is FaithEval's own rule; the
# consequence is that this task's accuracy is an UPPER BOUND. Use --strict-match
# (strict_valid_phrases below) when the absolute level matters.
valid_phrases:
  - unknown
  - no answer
  - no information
  - not
  - unclear

strict_valid_phrases:
  - unknown

context_column: context
question_column: question
