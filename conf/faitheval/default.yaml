# FaithEval — contextual faithfulness. Evaluates the model's own generations.
# One run per task in `tasks`.
enabled: true
python: null                 # null => use the global `python`
tasks: [unanswerable, inconsistent, counterfactual]
split: test
strict_match: false          # use each task's strict valid-phrase list
num_samples: null            # null => use the global `num_samples`
max_new_tokens: 256
# Prompts generated per forward pass. The eval loop is one generate() call per
# example, so on a GPU this is close to a linear speed-up until memory binds.
# Lower it on CUDA OOM. It is recorded in each task's summary.json: padding shifts
# the logits slightly, so a greedy argmax tie can break the other way — keep this
# FIXED across every model you compare.
batch_size: 8 #32 rtx 8000 qwen 2.5 0.5b
extra_args: []               # raw flags forwarded to src/run_eval.py, e.g. ["--do-sample"]
