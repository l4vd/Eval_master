# HaluEval — hallucination recognition. Uses the model as the Yes/No judge
# (--backend hf). One run per task in `tasks`.
enabled: true
python: null
tasks: [qa, dialogue, summarization]
backend: hf                  # hf (local judge) | openai (reproduction, needs OPENAI_API_KEY)
num_samples: null            # null => use the global `num_samples`
# null => per-prompt-format default (see hf_local.DEFAULT_MAX_NEW_TOKENS): 16 for the
# flat/completion format, 128 for the chat format. This mirrors the OpenAI endpoints the
# original script used — ChatCompletion was called with NO max_tokens, so the published
# protocol never truncated a judge mid-verdict, while Completion's own default is 16.
# It matters because an unparseable judgement is scored as WRONG, so too small a budget
# silently converts "verbose" into "incorrect". Recorded in summary.json.
max_new_tokens: null
# Seed for the coin flip choosing whether each row is shown its hallucinated or its
# correct output. Upstream never seeds, so each run scores a different random 50/50
# partition and two arms are compared on two different label draws. Pinning it makes
# the comparison PAIRED without changing the metric's distribution. Keep it identical
# across every model you compare; for error bars, sweep it (seed=42,43,...) and report
# mean +/- std. null reproduces upstream's unseeded behaviour. Recorded in summary.json.
seed: 42
# Judge prompts per forward pass (backend: hf only). Each task is 10,000 rows and
# only 16 tokens are generated per row, so at batch_size=1 this benchmark is almost
# entirely per-call overhead — this is the single biggest runtime lever here.
# `summarization` carries the longest prompts; lower this if it OOMs. Recorded in
# summary.json — keep it FIXED across every model you compare.
batch_size: 8 #32 rtx 8000 qwen 2.5 0.5b
# Order judge prompts by token length before cutting batches: desc | asc | none.
# Only 16 tokens are generated per row, so runtime here is essentially the cost of the
# PROMPT — and the pipeline pads every batch to its own longest one. In dataset order a
# single long document drags its whole batch up; bucketing by length removes that waste.
# This is the second-biggest runtime lever after batch_size, and by far the biggest on
# `summarization`, whose CNN/DM documents have the widest length spread.
# desc rather than asc so the peak-memory batch runs FIRST: a CUDA OOM then surfaces in
# the first minute instead of after most of the run is already spent.
# The Yes/No ground truths are drawn before the reordering, so the labels are unaffected;
# batch composition does change, though, which can flip a greedy argmax tie — keep this
# FIXED across every model you compare. Recorded in summary.json. Ignored on backend: openai.
sort_by_length: desc

# --- Modified protocols: opt-in, and the defaults below reproduce the original protocol ---
# Anything other than `scoring: generate` / `decontam.enabled: false` is a MODIFIED protocol:
# write it to its own output root ($EVAL_ROOT_MOD), never next to the original runs
# (EXPERIMENT_PROCEDURE.md §5.2), and read it as context only.
#
# How a judgement is scored.
#   generate    (default) the original protocol: decode a verdict and parse it; an
#               unparseable verdict counts as wrong.
#   constrained decode nothing: one prefill per row reads logP("Yes") vs logP("No") for the
#               first answer token (raw logits, pooled once per token id over every token
#               decoding to Yes/yes/YES, bare or after one space, and likewise No),
#               scored by AUROC. No parser, so output format
#               cannot move it; cheaper than generate. Labels are drawn exactly as in
#               generate. Artifacts: <task>_<label>_constrained_{results,summary}.json; the
#               original results file is never opened.
#   both        the original run plus the prefill, over one model load.
scoring: generate
# Eval-side decontamination of a live run. When enabled AND
# <exclusion_dir>/halueval__<task>.json exists (analysis/overlap.py --write-exclusions), the
# run also writes <task>_<label>[_constrained]_decontam_summary.json: the same rows scored on
# the original, decontaminated, seen, clean and unseen-exposed row sets (no extra model calls).
# The original summary is written as always. exclusion_dir is relative to Eval_master.
# For runs that already finished, use analysis/run_decontam.sh (no GPU) instead.
decontam:
  enabled: false
  exclusion_dir: decontamination/ragtruth

extra_args: []               # raw flags forwarded to evaluation/evaluate.py
